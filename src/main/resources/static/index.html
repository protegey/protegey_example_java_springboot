<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Protegey — Spring Boot example</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
        pre { background: #f4f4f4; padding: 1rem; border-radius: 4px; white-space: pre-wrap; }
        button { margin: 0 0.5rem 0.5rem 0; }
        input { margin: 0 0.5rem 0.5rem 0; }
    </style>
</head>
<body>
    <h1>Protegey — Spring Boot example</h1>
    <p>Demonstrates <code>protegey-sdk</code> (Java) from a Spring Boot backend. See <code>ProtegeyDemoController.java</code>.</p>

    <div>
        <button id="report">Report a test transaction</button>
        <button id="transactions">My transactions</button>
        <button id="alerts">Open alerts</button>
    </div>
    <div>
        <button id="kyc">Verify my identity</button>
        <button id="kycStatus">KYC status</button>
    </div>
    <div>
        <input id="name" placeholder="Name to screen">
        <button id="screen">Sanctions screen</button>
    </div>
    <div>
        <input id="phone" placeholder="+221771234567">
        <button id="signal">Shared signal check</button>
        <button id="invite">Invite business (phone)</button>
    </div>

    <pre id="log">Click a button to call the backend.</pre>

    <script>
        const log = document.getElementById('log');
        const show = (label, data) => { log.textContent = label + '\n' + JSON.stringify(data, null, 2); };
        const call = async (method, path) => (await fetch(path, { method })).json();
        const q = (params) => new URLSearchParams(params).toString();
        const on = (id, fn) => document.getElementById(id).addEventListener('click', fn);

        on('report', async () => show('transactions.report()', await call('POST', '/protegey/report-transaction')));
        on('transactions', async () => show('transactions.list()', await call('GET', '/protegey/transactions')));
        on('alerts', async () => show('alerts.list({status: OPEN})', await call('GET', '/protegey/alerts')));
        on('kyc', async () => {
            const result = await call('POST', '/protegey/start-kyc');
            show('kyc.startSession()', result);
            if (result.url) window.open(result.url, '_blank', 'noopener,noreferrer');
        });
        on('kycStatus', async () => show('kyc.getSession()', await call('GET', '/protegey/kyc-status')));
        on('screen', async () => show('sanctions.screen()',
            await call('POST', '/protegey/screen?' + q({ name: document.getElementById('name').value }))));
        on('signal', async () => show('sharedSignal.check()',
            await call('POST', '/protegey/shared-signal-check?' + q({ phoneNumber: document.getElementById('phone').value }))));
        on('invite', async () => show('kyb.invite()',
            await call('POST', '/protegey/invite-business?' + q({ contactName: 'Demo Business', contactPhone: document.getElementById('phone').value }))));
    </script>
</body>
</html>
